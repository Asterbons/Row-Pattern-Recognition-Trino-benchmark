name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: script & Python syntax ──────────────────────────────────────────
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: bash -n run_all.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile benchmark.py
          python -m py_compile plot_results.py
          python -m py_compile plot_scalability.py
          python -m py_compile run_scalability.py
          python -m py_compile Generator/Generator.py
          python -m py_compile Generator/generate_all_scales.py

  # ── Job 2: venv + deps + data generation ───────────────────────────────────
  generate:
    name: Virtualenv + data generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Generate tiny dataset
        run: |
          source .venv/bin/activate
          python Generator/Generator.py --type tiny --seed 42

      - name: Verify CSV was created
        run: |
          ls -lh datasets/tiny/
          wc -l datasets/tiny/crime_data.csv

  # ── Job 3: Trino smoke test (reduced JVM heap for CI) ──────────────────────
  smoke:
    name: Trino smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (for data generation only)
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Generate tiny dataset
        run: |
          source .venv/bin/activate
          python Generator/Generator.py --type tiny --seed 42

      - name: Patch Trino JVM config for CI (4G heap instead of 12G)
        run: |
          sed -i 's/\r$//' etc/trino/jvm.config etc/trino/config.properties
          sed -i 's/-Xmx12G/-Xmx4G/' etc/trino/jvm.config
          sed -i 's/query.max-memory=8GB/query.max-memory=3GB/' etc/trino/config.properties
          sed -i 's/query.max-memory-per-node=8GB/query.max-memory-per-node=3GB/' etc/trino/config.properties

      - name: Generate init SQL for tiny dataset
        run: |
          mkdir -p init-scripts
          printf '%s\n' \
            'CREATE TABLE IF NOT EXISTS crime_data (' \
            '    id            INTEGER PRIMARY KEY,' \
            '    district      VARCHAR(100),' \
            '    datetime      TIMESTAMP,' \
            '    primary_type  VARCHAR(50),' \
            '    lat           DOUBLE PRECISION,' \
            '    lon           DOUBLE PRECISION' \
            ');' \
            'COPY crime_data (id, district, datetime, primary_type, lat, lon)' \
            "FROM '/project_data/datasets/tiny/crime_data.csv'" \
            "DELIMITER ','" \
            'CSV HEADER;' \
            > init-scripts/init-db.sql
          echo '--- init-db.sql ---'
          cat init-scripts/init-db.sql

      - name: Start stack and run smoke test inside Docker
        run: |
          docker compose up -d
          docker compose run --rm -v "$PWD/smoke_test.py:/smoke_test.py" benchmark python3 /smoke_test.py

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs
